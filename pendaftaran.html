<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab ITPLN - Pendaftaran</title>

    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>Open Recruitment Asisten</h1>

        <nav>
            <a href="inventaris.html">Inventaris</a>
            <a href="stok.html">Stok Barang</a>
            <a href="pendaftaran.html" class="active">Pendaftaran</a>
            <a href="akun.html">Portal Akun</a>
        </nav>

    </header>

    <!-- Main -->
    <main>

        <form class="reg-form">

            <fieldset>

                <legend>Data Identitas Calon Asisten</legend>

                <!-- Nama -->
                <div class="form-group">

                    <label>Nama Lengkap:</label>

                    <input 
                        type="text"
                        placeholder="Sesuai KTM"
                    >

                </div>

                <!-- Minat -->
                <div class="form-group">

                    <label>Minat Laboratorium:</label>

                    <select>
                        <option>Information Retrieval</option>
                        <option>Software Engineering</option>
                        <option>Intelligent Computing</option>
                    </select>

                </div>

                <!-- Bahasa -->
                <div class="form-group">

                    <label>Bahasa Pemrograman:</label>

                    <div class="checkbox-group">

                        <label>
                            <input type="checkbox">
                            Python
                        </label>

                        <label>
                            <input type="checkbox">
                            Java
                        </label>

                        <label>
                            <input type="checkbox">
                            PHP
                        </label>

                    </div>

                </div>

                <!-- Visi -->
                <div class="form-group">

                    <label>Visi & Misi:</label>

                    <textarea rows="5"></textarea>

                </div>

                <!-- Button -->
                <button type="submit">
                    Kirim Aplikasi
                </button>

            </fieldset>

        </form>

    </main>

</body>
</html>
